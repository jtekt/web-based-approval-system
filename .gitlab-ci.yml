stages:
  - build
  - test
  - release
  - deploy

variables:
  APPLICATION_NAME: shinsei-manager
  # Docker
  CONTAINER_IMAGE: ${AWS_ECR_PUBLIC_URL}/${APPLICATION_NAME}
  CONTAINER_IMAGE_TEST: ${CONTAINER_IMAGE}:test
  CONTAINER_IMAGE_LATEST: ${CONTAINER_IMAGE}:latest
  CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:${CI_COMMIT_TAG}
  # TDD
  TEST_NETWORK: tdd
  TEST_DB: tdd-db
  TEST_USER_MANAGER: tdd-user-manager

build:
  stage: build

  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - >
      aws ecr-public create-repository --region us-east-1 --repository-name ${APPLICATION_NAME}
      || echo "Repository might have already existed"
  script:
    - docker build --build-arg APP_VERSION=${CI_COMMIT_TAG} -t ${CONTAINER_IMAGE_TEST} .
    - docker push ${CONTAINER_IMAGE_TEST}

test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

  before_script:
    # Creating network for TDD
    - docker network create ${TEST_NETWORK}
    - >
      docker run
      -d
      --rm
      --name ${TEST_DB}
      --network ${TEST_NETWORK}
      --hostname ${TEST_DB}
      --env NEO4J_AUTH=none
      --health-cmd "cypher-shell 'RETURN 1'"
      --health-interval 2s
      neo4j:5.12.0
    # Wait until Neo4J is ready (fail after 2 minutes)
    - timeout 120 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} ${TEST_DB})" = healthy ]; do sleep 2; done'
    # Deploy a user-manager / authentication system
    - >
      docker run
      -d
      --rm
      --name ${TEST_USER_MANAGER}
      --network ${TEST_NETWORK}
      --hostname ${TEST_USER_MANAGER}
      --env NEO4J_URL=bolt://${TEST_DB}:7687
      --env NEO4J_USERNAME=neo4j
      --env NEO4J_PASSWORD=neo4j
      --env JWT_SECRET=keyboardcat
      --health-cmd "node -e \"fetch('http://localhost/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""
      --health-interval 2s
      732469118990.dkr.ecr.ap-northeast-1.amazonaws.com/employee-manager:latest
    # Wait until the account manager is ready (fail after 2 minutes)
    - timeout 120 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} ${TEST_USER_MANAGER})" = healthy ]; do sleep 2; done'
  script:
    - >
      docker run
      --rm
      --name tdd-app
      --network ${TEST_NETWORK}
      --env NEO4J_URL=bolt://${TEST_DB}:7687
      --env IDENTIFICATION_URL=http://${TEST_USER_MANAGER}/v3/users/self
      --env LOGIN_URL=http://${TEST_USER_MANAGER}/v3/auth/login
      --env TEST_USER_USERNAME=administrator
      --env TEST_USER_PASSWORD=administrator
      --env S3_BUCKET=jtekt-moreillon
      --env S3_REGION=$S3_REGION
      --env S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY
      --env S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID
      ${CONTAINER_IMAGE_TEST}
      npm run coverage

release:
  stage: release

  rules:
    - if: $CI_COMMIT_TAG

  script:
    - docker pull ${CONTAINER_IMAGE_TEST}
    # Tagging
    - docker tag ${CONTAINER_IMAGE_TEST} ${CONTAINER_IMAGE_TAGGED}
    - docker tag ${CONTAINER_IMAGE_TEST} ${CONTAINER_IMAGE_LATEST}
    # Pushing
    - docker push ${CONTAINER_IMAGE_TAGGED}
    - docker push ${CONTAINER_IMAGE_LATEST}

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - kubectl config use-context eks/gitlab-agent-for-kubernetes:eks
    - kubectl config set-context --current --namespace=${KUBERNETES_NAMESPACE}
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -
